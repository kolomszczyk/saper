<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes"
    />
    <title>Saper</title>
    <link rel="icon" type="image/svg+xml" href="favicon-flag-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="favicon-flag-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon-flag-light.svg" />
    <link rel="preload" href="bomb.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="bomb-black.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="flag.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="cross.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="favicon-flag-light.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="favicon-flag-dark.svg" as="image" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <h1 class="game-title">SAPER</h1>

      <main class="window" aria-label="Saper">
        <input id="difficulty" type="hidden" value="medium" />
        <input id="theme" type="hidden" value="dark" />

        <section class="scorebar" aria-label="Status gry">
          <div class="digits" aria-label="Licznik min"><span id="mine-counter">000</span></div>
          <button id="new-game" type="button" class="face" aria-label="Nowa gra">🙂</button>
          <div class="digits" aria-label="Timer"><span id="timer">000</span></div>
        </section>

        <section class="board-shell">
          <div class="board-zoom">
            <div id="board" class="board" role="grid" aria-label="Plansza Sapera"></div>
          </div>
        </section>

        <div class="replay-wrap">
          <button id="replay-game" type="button" class="replay-button" aria-label="Undo" disabled>↻</button>
        </div>
      </main>

      <section class="difficulty-picker" aria-label="Game difficulty">
        <button type="button" class="difficulty-button" data-difficulty="easy" aria-pressed="false">
          Easy
        </button>
        <button type="button" class="difficulty-button is-active" data-difficulty="medium" aria-pressed="true">
          Medium
        </button>
        <button type="button" class="difficulty-button" data-difficulty="hard" aria-pressed="false">
          Hard
        </button>
        <button type="button" class="difficulty-button" data-difficulty="custom" aria-pressed="false" hidden>
          Custom
        </button>
      </section>

      <section class="theme-picker" aria-label="Wybór motywu">
        <button type="button" class="theme-button is-active" data-theme="dark" aria-pressed="true">
          Dark
        </button>
        <button type="button" class="theme-button" data-theme="light" aria-pressed="false">
          Light
        </button>
      </section>

      <p class="credit-line"><a href="info.html">made by moonboy<br />settings</a></p>

    </div>

    <script src="shared-cookies.js"></script>
    <script src="shared-daily-game-limit.js"></script>
    <script src="shared-board-input.js"></script>
    <script src="shared-minesweeper-utils.js"></script>
    <script src="script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <h1 class="game-title">SAPER</h1>

      <main class="window" aria-label="Saper">
        <input id="difficulty" type="hidden" value="medium" />

        <section class="scorebar" aria-label="Status gry">
          <div class="digits" aria-label="Licznik min"><span id="mine-counter">000</span></div>
          <button id="new-game" type="button" class="face" aria-label="Nowa gra">🙂</button>
          <div class="digits" aria-label="Timer"><span id="timer">000</span></div>
        </section>

        <section class="board-shell">
          <div id="board" class="board" role="grid" aria-label="Plansza Sapera"></div>
        </section>

        <div class="replay-wrap">
          <button id="replay-game" type="button" class="replay-button" disabled>Cofnij</button>
        </div>
      </main>

      <section class="difficulty-picker" aria-label="Game difficulty">
        <button type="button" class="difficulty-button" data-difficulty="easy" aria-pressed="false">
          Easy
        </button>
        <button type="button" class="difficulty-button is-active" data-difficulty="medium" aria-pressed="true">
          Medium
        </button>
        <button type="button" class="difficulty-button" data-difficulty="hard" aria-pressed="false">
          Hard
        </button>
      </section>

    </div>

    <script src="script.js"></script>
  </body>
</html>

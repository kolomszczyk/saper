<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>made</title>
    <link rel="icon" type="image/svg+xml" href="favicon-flag-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="favicon-flag-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon-flag-light.svg" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .made-page {
        width: min(760px, 100%);
        align-items: stretch;
      }

      .top-actions {
        display: flex;
        justify-content: center;
        margin-bottom: 12px;
      }

      .back-button {
        min-width: 164px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .made-window {
        width: 100%;
        margin-left: 0;
        font-family: var(--ui-font);
      }

      .made-title-wrap {
        display: block;
        width: fit-content;
        margin: 0 auto 10px;
        padding: 8px;
        background: var(--mid);
        border-top: 3px solid var(--dark);
        border-left: 3px solid var(--dark);
        border-right: 3px solid var(--light);
        border-bottom: 3px solid var(--light);
      }

      .made-title-display {
        width: fit-content;
        min-width: 0;
        padding-inline: 10px;
        cursor: pointer;
      }

      .made-title-display span {
        letter-spacing: 3px;
      }

      .made-title-display:active {
        border-top-color: var(--digits-frame);
        border-left-color: var(--digits-frame);
        border-right-color: var(--deep);
        border-bottom-color: var(--deep);
      }

      .made-title-display:focus-visible {
        outline: 2px solid var(--picker-focus);
        outline-offset: 3px;
      }

      .made-board-shell {
        padding: 6px;
        width: fit-content;
        margin: 0 auto;
      }

      .made-board-stack {
        --made-cell-size: 24px;
        position: relative;
        width: fit-content;
      }

      .made-board {
        grid-template-columns: repeat(22, var(--made-cell-size));
        grid-auto-rows: var(--made-cell-size);
      }

      .made-board-overlays {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(22, var(--made-cell-size));
        grid-auto-rows: var(--made-cell-size);
        z-index: 3;
      }

      .made-board .cell {
        cursor: pointer;
        position: relative;
        width: var(--made-cell-size);
        height: var(--made-cell-size);
      }

      .made-board .cell::before {
        content: attr(data-index);
        position: absolute;
        top: 2px;
        left: 3px;
        font-size: 8px;
        line-height: 1;
        font-weight: 700;
        color: rgba(235, 241, 247, 0.8);
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.7);
        pointer-events: none;
        z-index: 4;
      }

      .made-board .cell.open {
        font-size: 16px;
        cursor: default;
      }

      .made-board .cell.is-text-reserved.open {
        background: #05070b;
      }

      .made-board .cell.debug-mine {
        position: relative;
      }

      .made-board .cell.debug-mine::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff3b3b;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45), 0 0 8px rgba(255, 59, 59, 0.5);
        inset: 0;
        margin: auto;
        pointer-events: none;
      }

      .made-board-overlay {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        justify-self: stretch;
        align-self: center;
        width: 100%;
        height: 100%;
        max-width: none;
        padding: 0 0 0 4px;
        font-family: var(--ui-font);
        font-size: 17px;
        font-weight: 700;
        color: var(--body-text);
        line-height: 1;
        text-align: left;
        pointer-events: none;
        z-index: 1;
      }

      .made-board-overlay.is-logo {
        justify-content: center;
        padding: 0;
      }

      .made-board-overlay.is-logo svg {
        width: 34px;
        height: 34px;
        display: block;
        fill: #ffffff;
      }

      .made-board-overlay.is-link {
        color: var(--picker-focus);
      }

      .made-board-overlay.is-link a {
        color: inherit;
        text-decoration: none;
        pointer-events: auto;
      }

      .made-board-overlay.is-link a:hover,
      .made-board-overlay.is-link a:focus-visible {
        text-decoration: underline;
      }

      .made-theme-picker {
        margin-top: 18px;
      }

      .made-undo-wrap {
        display: flex;
        justify-content: center;
        margin-top: 10px;
      }

      .made-undo {
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
      }

      .made-undo:disabled {
        opacity: 0.45;
        cursor: default;
      }

      @media (max-width: 560px) {
        .made-board-shell {
          overflow: auto;
        }

        .made-board-overlay {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page made-page">
      <div class="top-actions">
        <a class="theme-button back-button" href="index.html" aria-label="Back to game page">Back to Game</a>
      </div>

      <main class="window made-window" aria-label="Project information">
        <div class="made-title-wrap">
          <button type="button" id="made-reset" class="digits made-title-display" aria-label="Reset board">
            <span>SAPER</span>
          </button>
        </div>

        <section class="board-shell made-board-shell" aria-label="Project details board">
          <div class="made-board-stack">
            <div id="made-board" class="board made-board" role="grid" aria-label="Minesweeper-style project details"></div>
            <div id="made-board-overlays" class="made-board-overlays" aria-hidden="true"></div>
          </div>
        </section>

        <div class="made-undo-wrap">
          <button type="button" id="made-undo" class="cell made-undo" aria-label="Undo last move" disabled>↻</button>
        </div>
      </main>

      <section class="theme-picker made-theme-picker" aria-label="Theme selection">
        <button type="button" class="theme-button is-active" data-theme="dark" aria-pressed="true">
          Dark
        </button>
        <button type="button" class="theme-button" data-theme="light" aria-pressed="false">
          Light
        </button>
      </section>
    </div>

    <script>
      const root = document.documentElement;
      const themeButtons = Array.from(document.querySelectorAll(".theme-picker .theme-button"));
      const madeBoard = document.getElementById("made-board");
      const madeBoardOverlays = document.getElementById("made-board-overlays");
      const resetButton = document.getElementById("made-reset");
      const undoButton = document.getElementById("made-undo");
      const savedTheme = localStorage.getItem("theme");
      const startTheme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : "dark";

      const boardCols = 22;
      const boardRows = 14;
      const allCells = [];
      const state = new Map();
      const historyStack = [];
      let revealAllMines = false;
      let gameFinished = false;
      const debugShowMines = true;
      const startAsUnplayed = true;
      const openReservedTextTilesAtStart = false;
      const autoRevealUnderTextOnStart = true;
      const autoRevealExtraSafeClicksMin = 2;
      const autoRevealExtraSafeClicksMax = 8;
      const autoFlagAroundOpenAreaRatio = 0.8;

      const staticMinePositions = [
        [2, 2], [4, 3], [6, 4],
        [18, 5], [23, 5],
        [20, 6],
        [3, 7], [9, 7], [16, 7], [22, 7],
        [6, 8], [13, 8], [19, 8], [24, 8],
        [2, 9], [7, 9], [15, 9], [21, 9],
        [4, 10], [10, 10], [17, 10], [23, 10],
        [6, 11], [12, 11], [19, 11], [24, 11],
        [3, 12], [9, 12], [16, 12], [22, 12],
        [5, 13], [11, 13], [18, 13], [24, 13],
        [8, 14], [20, 14],
        [14, 15], [23, 15],
      ];
      const mineCount = 45;
      let minePositions = staticMinePositions.map(([c, r]) => [c, r]);
      const initialFlagPositions = [
        [2, 8],
        [22, 9],
        [23, 10],
        [19, 11],
        [20, 12],
        [22, 13],
      ];

      const textZones = [
        {
          c: 7,
          r: 4,
          w: 4,
          h: 1,
          text: "build by",
          centerText: true,
          openAtStart: false,
          reserveRuns: [{ c: 7, r: 4, w: 4, h: 1 }],
        },
        {
          c: 9,
          r: 5,
          w: 6,
          h: 1,
          text: "kolomszczyk",
          centerText: true,
          openAtStart: false,
          reserveRuns: [{ c: 9, r: 5, w: 6, h: 1 }],
        },
        {
          c: 10,
          r: 9,
          w: 6,
          h: 1,
          text: "with Codex AI",
          centerText: true,
          openAtStart: false,
          reserveRuns: [{ c: 10, r: 9, w: 6, h: 1 }],
        },
        {
          c: 11,
          r: 11,
          w: 2,
          h: 2,
          reserveOnly: true,
          openAtStart: false,
          logoCopies: [
            { c: 9, r: 11, w: 2, h: 2 },
            { c: 13, r: 11, w: 2, h: 2 },
          ],
        },
      ];
      const reservedTextTileKeys = new Set();
      const bombExclusionKeys = new Set();

      for (const zone of textZones) {
        const runs = zone.reserveRuns ?? [{ c: zone.c, r: zone.r, w: zone.w, h: zone.h }];
        for (const run of runs) {
          for (let rr = run.r; rr < run.r + run.h; rr += 1) {
            for (let cc = run.c; cc < run.c + run.w; cc += 1) {
              if (!inBounds(cc, rr)) continue;
              reservedTextTileKeys.add(`${cc},${rr}`);
              for (let dr = -1; dr <= 1; dr += 1) {
                for (let dc = -1; dc <= 1; dc += 1) {
                  const nc = cc + dc;
                  const nr = rr + dr;
                  if (!inBounds(nc, nr)) continue;
                  bombExclusionKeys.add(`${nc},${nr}`);
                }
              }
            }
          }
        }

        for (const copy of zone.logoCopies ?? []) {
          for (let rr = copy.r; rr < copy.r + copy.h; rr += 1) {
            for (let cc = copy.c; cc < copy.c + copy.w; cc += 1) {
              if (!inBounds(cc, rr)) continue;
              // Keep a 1-tile buffer including diagonals ("corners") around logos too.
              for (let dr = -1; dr <= 1; dr += 1) {
                for (let dc = -1; dc <= 1; dc += 1) {
                  const nc = cc + dc;
                  const nr = rr + dr;
                  if (!inBounds(nc, nr)) continue;
                  bombExclusionKeys.add(`${nc},${nr}`);
                }
              }
            }
          }
        }
      }

      function loadOrCreateMineLayout() {
        const candidates = [];
        for (let r = 1; r <= boardRows; r += 1) {
          for (let c = 1; c <= boardCols; c += 1) {
            if (bombExclusionKeys.has(key(c, r))) continue;
            candidates.push([c, r]);
          }
        }

        // Fisher-Yates shuffle for unbiased random placement.
        for (let i = candidates.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }

        minePositions = candidates.slice(0, Math.min(mineCount, candidates.length));
      }

      function key(c, r) {
        return `${c},${r}`;
      }

      function isReservedTextTile(c, r) {
        return reservedTextTileKeys.has(key(c, r));
      }

      function inBounds(c, r) {
        return c >= 1 && c <= boardCols && r >= 1 && r <= boardRows;
      }

      function neighbors(c, r) {
        const result = [];
        for (let dr = -1; dr <= 1; dr += 1) {
          for (let dc = -1; dc <= 1; dc += 1) {
            if (dc === 0 && dr === 0) continue;
            const nc = c + dc;
            const nr = r + dr;
            if (inBounds(nc, nr)) result.push([nc, nr]);
          }
        }
        return result;
      }

      function buildState() {
        state.clear();
        revealAllMines = false;
        gameFinished = false;
        historyStack.length = 0;
        loadOrCreateMineLayout();

        for (let r = 1; r <= boardRows; r += 1) {
          for (let c = 1; c <= boardCols; c += 1) {
            state.set(key(c, r), {
              c,
              r,
              mine: false,
              count: 0,
              open: false,
              flagged: false,
            });
          }
        }

        for (const [c, r] of minePositions) {
          const cell = state.get(key(c, r));
          if (cell) cell.mine = true;
        }

        if (!startAsUnplayed) {
          for (const [c, r] of initialFlagPositions) {
            const cell = state.get(key(c, r));
            if (cell && !cell.open) cell.flagged = true;
          }
        }

        for (let r = 1; r <= boardRows; r += 1) {
          for (let c = 1; c <= boardCols; c += 1) {
            const cell = state.get(key(c, r));
            if (!cell || cell.mine) continue;
            let count = 0;
            for (const [nc, nr] of neighbors(c, r)) {
              if (state.get(key(nc, nr))?.mine) count += 1;
            }
            cell.count = count;
          }
        }

        for (const zone of textZones) {
          if (!openReservedTextTilesAtStart && !zone.openAtStart) continue;
          const runs = zone.reserveRuns ?? [{ c: zone.c, r: zone.r, w: zone.w, h: zone.h }];
          for (const run of runs) {
            for (let rr = run.r; rr < run.r + run.h; rr += 1) {
              for (let cc = run.c; cc < run.c + run.w; cc += 1) {
                if (!inBounds(cc, rr)) continue;
                const cell = state.get(key(cc, rr));
                if (!cell) continue;
                cell.open = true;
              }
            }
          }
        }
      }

      function snapshotState() {
        return {
          revealAllMines,
          gameFinished,
          cells: Array.from(state.values(), (cell) => ({
            c: cell.c,
            r: cell.r,
            open: cell.open,
            flagged: cell.flagged,
          })),
        };
      }

      function restoreSnapshot(snapshot) {
        if (!snapshot) return;
        revealAllMines = snapshot.revealAllMines;
        gameFinished = snapshot.gameFinished;
        for (const item of snapshot.cells) {
          const cell = state.get(key(item.c, item.r));
          if (!cell) continue;
          cell.open = item.open;
          cell.flagged = item.flagged;
        }
      }

      function pushHistory() {
        historyStack.push(snapshotState());
        if (historyStack.length > 100) historyStack.shift();
      }

      function undoLastMove() {
        const snapshot = historyStack.pop();
        if (!snapshot) return;
        restoreSnapshot(snapshot);
        renderBoard();
      }

      function resetGame() {
        buildState();
        autoRevealTextZones();
        autoRevealExtraSafeCells();
        autoFlagAroundOpenArea();
        renderBoard();
      }

      function autoRevealTextZones() {
        if (!autoRevealUnderTextOnStart) return;

        for (const zone of textZones) {
          if (zone.reserveOnly) continue; // skip logo zones
          const runs = zone.reserveRuns ?? [{ c: zone.c, r: zone.r, w: zone.w, h: zone.h }];
          for (const run of runs) {
            for (let rr = run.r; rr < run.r + run.h; rr += 1) {
              for (let cc = run.c; cc < run.c + run.w; cc += 1) {
                if (!inBounds(cc, rr)) continue;
                const cell = state.get(key(cc, rr));
                if (!cell || cell.open || cell.flagged || cell.mine) continue;
                if (cell.count === 0) {
                  revealZeros(cell);
                } else {
                  cell.open = true;
                }
              }
            }
          }
        }

        checkWin();
      }

      function autoFlagAroundOpenArea() {
        if (!(autoFlagAroundOpenAreaRatio > 0)) return;

        const borderMineCells = [];
        const seen = new Set();

        for (const cell of state.values()) {
          if (!cell.open) continue;
          for (const [nc, nr] of neighbors(cell.c, cell.r)) {
            const k = key(nc, nr);
            if (seen.has(k)) continue;
            seen.add(k);
            const next = state.get(k);
            if (!next || next.open || !next.mine) continue;
            borderMineCells.push(next);
          }
        }

        if (borderMineCells.length === 0) return;

        const targetCount = Math.ceil(borderMineCells.length * autoFlagAroundOpenAreaRatio);
        for (let i = borderMineCells.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [borderMineCells[i], borderMineCells[j]] = [borderMineCells[j], borderMineCells[i]];
        }

        for (let i = 0; i < targetCount; i += 1) {
          borderMineCells[i].flagged = true;
        }
      }

      function autoRevealExtraSafeCells() {
        if (!(autoRevealExtraSafeClicksMax > 0)) return;
        if (gameFinished) return;

        const candidates = [];
        const seen = new Set();
        for (const openCellRef of state.values()) {
          if (!openCellRef.open) continue;
          for (const [nc, nr] of neighbors(openCellRef.c, openCellRef.r)) {
            const k = key(nc, nr);
            if (seen.has(k)) continue;
            seen.add(k);
            const cell = state.get(k);
            if (!cell || cell.open || cell.flagged || cell.mine) continue;
            candidates.push(cell);
          }
        }
        if (candidates.length === 0) return;

        // Shuffle so the extra clicks are truly random and look natural.
        for (let i = candidates.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }

        const minClicks = Math.max(0, Math.min(autoRevealExtraSafeClicksMin, autoRevealExtraSafeClicksMax));
        const maxClicks = Math.max(minClicks, autoRevealExtraSafeClicksMax);
        const randomClicks = minClicks + Math.floor(Math.random() * (maxClicks - minClicks + 1));
        const clickCount = Math.min(randomClicks, candidates.length);
        for (let i = 0; i < clickCount; i += 1) {
          const cell = candidates[i];
          if (!cell || cell.open || cell.flagged || cell.mine) continue;
          if (cell.count === 0) {
            revealZeros(cell);
          } else {
            cell.open = true;
          }
        }

        checkWin();
      }

      function createBoardDom() {
        if (!madeBoard || !madeBoardOverlays) return;
        madeBoard.innerHTML = "";
        madeBoardOverlays.innerHTML = "";
        allCells.length = 0;

        for (let r = 1; r <= boardRows; r += 1) {
          for (let c = 1; c <= boardCols; c += 1) {
            const index = (r - 1) * boardCols + c;
            const el = document.createElement("button");
            el.type = "button";
            el.className = "cell";
            el.dataset.c = String(c);
            el.dataset.r = String(r);
            el.dataset.index = String(index);
            el.setAttribute("role", "gridcell");
            el.setAttribute("aria-label", `Cell ${index} (${c}, ${r})`);
            madeBoard.append(el);
            allCells.push(el);
          }
        }

        for (const zone of textZones) {
          if (!zone.reserveOnly) {
            const parts = zone.parts ?? [{ c: zone.c, r: zone.r, w: zone.w, h: zone.h, text: zone.text }];
            for (const part of parts) {
              const overlay = document.createElement("div");
              overlay.className = `made-board-overlay${zone.isLink ? " is-link" : ""}`;
              overlay.style.gridColumn = `${part.c} / span ${part.w}`;
              overlay.style.gridRow = `${part.r} / span ${part.h}`;
              if (zone.centerText) {
                overlay.style.justifyContent = "center";
                overlay.style.textAlign = "center";
                overlay.style.paddingLeft = "0";
              }

              if (zone.isLink) {
                const link = document.createElement("a");
                link.href = "https://github.com/kolomszczyk/saper";
                link.target = "_blank";
                link.rel = "noreferrer noopener";
                link.textContent = part.text;
                overlay.append(link);
              } else {
                overlay.textContent = part.text;
              }

              madeBoardOverlays.append(overlay);
            }
          } else {
            const overlay = document.createElement("div");
            overlay.className = "made-board-overlay is-logo";
            overlay.style.gridColumn = `${zone.c} / span ${zone.w}`;
            overlay.style.gridRow = `${zone.r} / span ${zone.h}`;
            overlay.setAttribute("aria-hidden", "true");
            overlay.innerHTML =
              '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.35c-2.24.49-2.71-.95-2.71-.95-.36-.93-.9-1.17-.9-1.17-.73-.5.06-.49.06-.49.8.06 1.22.82 1.22.82.72 1.2 1.87.86 2.33.66.07-.5.28-.85.5-1.05-1.78-.2-3.64-.88-3.64-3.9 0-.86.31-1.56.82-2.11-.08-.2-.35-1.02.08-2.12 0 0 .67-.21 2.2.8A7.7 7.7 0 0 1 8 4.07c.68 0 1.37.09 2.01.27 1.53-1.01 2.2-.8 2.2-.8.43 1.1.16 1.92.08 2.12.51.55.82 1.25.82 2.11 0 3.03-1.87 3.7-3.65 3.9.29.24.54.73.54 1.48v2.2c0 .21.14.46.55.38A8 8 0 0 0 8 0Z"/></svg>';
            madeBoardOverlays.append(overlay);

            for (const copy of zone.logoCopies ?? []) {
              const copyOverlay = document.createElement("div");
              copyOverlay.className = "made-board-overlay is-logo";
              copyOverlay.style.gridColumn = `${copy.c} / span ${copy.w}`;
              copyOverlay.style.gridRow = `${copy.r} / span ${copy.h}`;
              copyOverlay.setAttribute("aria-hidden", "true");
              copyOverlay.innerHTML = overlay.innerHTML;
              madeBoardOverlays.append(copyOverlay);
            }
          }
        }
      }

      function revealZeros(startCell) {
        const queue = [startCell];
        const seen = new Set([key(startCell.c, startCell.r)]);

        while (queue.length > 0) {
          const current = queue.shift();
          if (!current || current.flagged) continue;
          current.open = true;

          if (current.count !== 0) continue;

          for (const [nc, nr] of neighbors(current.c, current.r)) {
            const next = state.get(key(nc, nr));
            if (!next || next.open || next.flagged || next.mine) continue;
            next.open = true;
            if (next.count === 0) {
              const nk = key(nc, nr);
              if (!seen.has(nk)) {
                seen.add(nk);
                queue.push(next);
              }
            }
          }
        }
      }

      function revealAllBombs() {
        revealAllMines = true;
        for (const cell of state.values()) {
          if (cell.mine) cell.open = true;
        }
      }

      function checkWin() {
        for (const cell of state.values()) {
          if (!cell.mine && !cell.open) return false;
        }
        gameFinished = true;
        for (const cell of state.values()) {
          if (cell.mine) cell.flagged = true;
        }
        return true;
      }

      function openCell(c, r) {
        if (gameFinished) return;
        const cell = state.get(key(c, r));
        if (!cell || cell.open || cell.flagged) return;
        pushHistory();

        if (cell.mine) {
          cell.open = true;
          gameFinished = true;
          revealAllBombs();
          renderBoard();
          return;
        }

        if (cell.count === 0) {
          revealZeros(cell);
        } else {
          cell.open = true;
        }

        checkWin();
        renderBoard();
      }

      function toggleFlag(c, r) {
        if (gameFinished) return;
        const cell = state.get(key(c, r));
        if (!cell || cell.open) return;
        pushHistory();
        cell.flagged = !cell.flagged;
        renderBoard();
      }

      function renderBoard() {
        for (const el of allCells) {
          const c = Number(el.dataset.c);
          const r = Number(el.dataset.r);
          const cell = state.get(key(c, r));
          if (!cell) continue;
          const reservedTextTile = isReservedTextTile(c, r);

          el.className = "cell";
          el.textContent = "";

          if (cell.open) {
            el.classList.add("open");

            if (cell.mine && revealAllMines) {
              el.classList.add("mine");
            } else if (cell.count > 0) {
              el.classList.add(`n${cell.count}`);
              el.textContent = String(cell.count);
            }
          } else if (cell.flagged) {
            el.classList.add("flagged");
          }

          if (reservedTextTile && cell.open) {
            el.classList.add("is-text-reserved");
          }

          if (gameFinished && revealAllMines && cell.flagged && !cell.mine) {
            el.classList.add("wrong-flag");
          }

          if (debugShowMines && cell.mine) {
            el.classList.add("debug-mine");
          }
        }

        if (undoButton instanceof HTMLButtonElement) {
          undoButton.disabled = historyStack.length === 0;
        }
      }

      function setTheme(theme) {
        root.dataset.theme = theme;
        localStorage.setItem("theme", theme);
        for (const button of themeButtons) {
          const active = button.dataset.theme === theme;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", String(active));
        }
      }

      for (const button of themeButtons) {
        button.addEventListener("click", () => setTheme(button.dataset.theme));
      }

      createBoardDom();
      buildState();
      autoRevealTextZones();
      autoRevealExtraSafeCells();
      autoFlagAroundOpenArea();
      renderBoard();

      if (madeBoard) {
        madeBoard.addEventListener("click", (event) => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const cellEl = target.closest(".cell");
          if (!(cellEl instanceof HTMLButtonElement)) return;
          openCell(Number(cellEl.dataset.c), Number(cellEl.dataset.r));
        });

        madeBoard.addEventListener("contextmenu", (event) => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const cellEl = target.closest(".cell");
          if (!(cellEl instanceof HTMLButtonElement)) return;
          event.preventDefault();
          toggleFlag(Number(cellEl.dataset.c), Number(cellEl.dataset.r));
        });
      }

      if (resetButton instanceof HTMLButtonElement) {
        resetButton.addEventListener("click", resetGame);
      }

      if (undoButton instanceof HTMLButtonElement) {
        undoButton.addEventListener("click", undoLastMove);
      }

      setTheme(startTheme);
    </script>
  </body>
</html>

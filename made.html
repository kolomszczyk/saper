<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>made</title>
    <style>
      :root {
        --ui-font: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Geneva, sans-serif;
        --bg: #0d131f;
        --bg-soft: #121b2d;
        --card: rgba(255, 255, 255, 0.06);
        --text: #eef3ff;
        --muted: #a8b2c7;
        --border: rgba(255, 255, 255, 0.12);
        --accent: #7ee0c6;
        --accent-2: #8fb3ff;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        --picker-border-raised: #6a7483 #181c23 #181c23 #6a7483;
        --picker-border-pressed: #181c23 #6a7483 #6a7483 #181c23;
        --picker-bg: radial-gradient(circle at 30% 28%, #444d5b 0%, #2e3540 45%, #21262e 100%);
        --picker-text: #eef2f6;
        --picker-active-text: #f7fbff;
        --picker-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 3px 10px rgba(0, 0, 0, 0.3);
        --picker-active-shadow:
          inset 0 2px 4px rgba(0, 0, 0, 0.45),
          inset 0 -1px 0 rgba(255, 255, 255, 0.12);
        --picker-focus: #dfe9ff;
      }

      :root[data-theme="light"] {
        --bg: #edf2ff;
        --bg-soft: #dfe8ff;
        --card: rgba(255, 255, 255, 0.75);
        --text: #101a2b;
        --muted: #5f6f89;
        --border: rgba(16, 26, 43, 0.12);
        --accent: #167f6b;
        --accent-2: #355fcf;
        --shadow: 0 20px 50px rgba(59, 82, 143, 0.18);
        --picker-border-raised: #ffffff #7b7b7b #7b7b7b #ffffff;
        --picker-border-pressed: #7b7b7b #ffffff #ffffff #7b7b7b;
        --picker-bg: linear-gradient(#efefef, #d8d8d8);
        --picker-text: #111111;
        --picker-active-text: #111111;
        --picker-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 1px 0 rgba(0, 0, 0, 0.08);
        --picker-active-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
        --picker-focus: #2a62ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-rounded, "Trebuchet MS", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 20%, color-mix(in srgb, var(--accent-2) 28%, transparent), transparent 45%),
          radial-gradient(circle at 90% 10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 48%),
          linear-gradient(160deg, var(--bg), var(--bg-soft));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .page {
        width: min(760px, 100%);
      }

      .hero {
        border: 1px solid var(--border);
        background: var(--card);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: clamp(24px, 4vw, 42px);
      }

      .eyebrow {
        margin: 0;
        color: var(--muted);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 12px;
      }

      h1 {
        margin: 12px 0 10px;
        font-size: clamp(2rem, 7vw, 4.2rem);
        line-height: 0.95;
      }

      .grad {
        color: transparent;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        background-clip: text;
      }

      .desc {
        margin: 0;
        max-width: 42ch;
        color: var(--muted);
        line-height: 1.55;
      }

      .credit {
        margin-top: 28px;
      }

      .credit a {
        color: var(--text);
        text-decoration: none;
        border-bottom: 1px solid color-mix(in srgb, var(--text) 35%, transparent);
        padding-bottom: 2px;
      }

      .credit a:hover,
      .credit a:focus-visible {
        color: var(--accent);
        border-color: var(--accent);
        outline: none;
      }

      .theme-dock {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      .theme-button {
        width: 96px;
        height: 44px;
        border-radius: 0;
        border: 3px solid;
        border-color: var(--picker-border-raised);
        background: var(--picker-bg);
        color: var(--picker-text);
        font-family: var(--ui-font);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        user-select: none;
        box-shadow: var(--picker-shadow);
        transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
      }

      .theme-button:hover {
        filter: brightness(1.08);
      }

      .theme-button:active {
        transform: translateY(1px);
        border-color: var(--picker-border-pressed);
      }

      .theme-button.is-active {
        background: var(--picker-bg);
        border-color: var(--picker-border-pressed);
        color: var(--picker-active-text);
        box-shadow: var(--picker-active-shadow);
        transform: translateY(1px);
      }

      .theme-button:focus-visible {
        outline: 2px solid var(--picker-focus);
        outline-offset: 3px;
      }

      @media (max-width: 560px) {
        body {
          padding: 16px;
          align-items: start;
        }

        .hero {
          border-radius: 18px;
          padding: 20px;
          margin-top: 10vh;
        }

        .theme-dock {
          width: calc(100% - 32px);
          justify-content: center;
          gap: 10px;
        }

        .theme-button {
          width: min(96px, 44vw);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main class="hero" aria-label="Strona tymczasowa">
        <p class="eyebrow">W budowie</p>
        <h1>
          <span class="grad">made</span><br />
          w przygotowaniu
        </h1>
        <p class="desc">
          Nazwa jeszcze się tworzy. Na razie to tymczasowy ekran startowy, który można potem rozbudować.
        </p>
        <p class="credit">
          <a href="index.html" aria-label="Powrót do strony Saper">made by moonboy</a>
        </p>
      </main>
    </div>

    <section class="theme-dock" aria-label="Wybór motywu">
      <button type="button" class="theme-button is-active" data-theme="dark" aria-pressed="true">
        Dark
      </button>
      <button type="button" class="theme-button" data-theme="light" aria-pressed="false">
        Light
      </button>
    </section>

    <script>
      const root = document.documentElement;
      const themeButtons = Array.from(document.querySelectorAll(".theme-button"));
      const savedTheme = localStorage.getItem("theme");
      const startTheme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : "dark";

      function setTheme(theme) {
        root.dataset.theme = theme;
        localStorage.setItem("theme", theme);
        for (const button of themeButtons) {
          const active = button.dataset.theme === theme;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", String(active));
        }
      }

      for (const button of themeButtons) {
        button.addEventListener("click", () => setTheme(button.dataset.theme));
      }

      setTheme(startTheme);
    </script>
  </body>
</html>

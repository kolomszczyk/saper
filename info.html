<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Details</title>
    <link rel="icon" type="image/svg+xml" href="favicon-flag-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="favicon-flag-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon-flag-light.svg" />
    <link rel="preload" href="bomb.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="bomb-black.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="flag.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="cross.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="favicon-flag-light.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="favicon-flag-dark.svg" as="image" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="info.css" />
  </head>
  <body>
    <div class="page info-page">
      <div class="top-actions">
        <a class="theme-button back-button" href="index.html" aria-label="Back to game page">Back to Game</a>
      </div>

      <div class="info-window-pan">
        <main class="window info-window" aria-label="Project information">
          <div class="info-title-wrap">
            <button type="button" id="info-reset" class="digits info-title-display" aria-label="Reset board">
              <span>SAPER</span>
            </button>
          </div>

          <section class="board-shell info-board-shell" aria-label="Project details board">
            <div class="info-board-zoom">
              <div id="info-board-stack" class="info-board-stack">
                <div id="info-board" class="board info-board" role="grid" aria-label="Minesweeper-style project details"></div>
                <div id="info-board-overlays" class="info-board-overlays" aria-hidden="true"></div>
              </div>
            </div>
          </section>

          <div class="info-undo-wrap">
            <button type="button" id="info-undo" class="cell info-undo" aria-label="Undo last move" disabled>↻</button>
          </div>
        </main>
      </div>

      <div class="info-window-pan info-settings-window-pan">
        <main class="window info-window info-settings-window" aria-label="Settings">
          <div class="info-title-wrap">
            <button type="button" class="digits info-title-display" aria-label="Settings title" disabled>
              <span>SETTINGS</span>
            </button>
          </div>

          <section class="board-shell info-settings-shell" aria-label="Settings options">
            <form class="info-settings-form" action="#" method="get" onsubmit="return false;">
              <div class="info-settings-layout">
                <div class="info-settings-left-col">
                  <div class="info-settings-pair">
                    <div class="info-settings-row info-settings-field">
                      <label for="map-width">Width</label>
                      <input
                        id="map-width"
                        class="info-settings-digital-input"
                        type="text"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        value="20"
                        autocomplete="off"
                        spellcheck="false"
                      />
                    </div>

                    <div class="info-settings-row info-settings-field">
                      <label for="map-height">Height</label>
                      <input
                        id="map-height"
                        class="info-settings-digital-input"
                        type="text"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        value="70"
                        autocomplete="off"
                        spellcheck="false"
                      />
                    </div>
                  </div>

                  <div class="info-settings-row info-settings-field info-settings-checkbox-field">
                    <label for="custom-map">Custom map</label>
                    <div class="info-settings-checkbox-display">
                      <label class="info-settings-switch" for="custom-map" aria-label="Toggle custom map">
                        <input id="custom-map" type="checkbox" />
                        <span class="info-settings-switch-track" aria-hidden="true">
                          <span class="info-settings-switch-label info-settings-switch-label-on">On</span>
                          <span class="info-settings-switch-label info-settings-switch-label-off">Off</span>
                          <span class="info-settings-switch-thumb"></span>
                        </span>
                      </label>
                    </div>
                  </div>
                </div>

                <div class="info-settings-right-col">
                  <div class="info-settings-row info-settings-field info-settings-bombs-field">
                    <label for="bomb-count">Bomb count</label>
                    <input
                      id="bomb-count"
                      class="info-settings-digital-input"
                      type="text"
                      inputmode="numeric"
                      pattern="[0-9]*"
                      value="205"
                      autocomplete="off"
                      spellcheck="false"
                    />
                  </div>

                  <div class="info-settings-row info-settings-field info-settings-games-field">
                    <label for="games-per-day">Games per day</label>
                    <input
                      id="games-per-day"
                      class="info-settings-digital-input"
                      type="text"
                      inputmode="numeric"
                      pattern="[0-9]*"
                      value="500"
                      autocomplete="off"
                      spellcheck="false"
                    />
                  </div>
                </div>
              </div>

              <div class="info-settings-actions">
                <button type="button" class="theme-button info-settings-save">
                  Save
                </button>
              </div>

            </form>
          </section>
        </main>
      </div>

      <section class="theme-picker info-theme-picker" aria-label="Theme selection">
        <button type="button" class="theme-button is-active" data-theme="dark" aria-pressed="true">
          Dark
        </button>
        <button type="button" class="theme-button" data-theme="light" aria-pressed="false">
          Light
        </button>
      </section>
    </div>

    <script src="shared-cookies.js"></script>
    <script src="shared-daily-game-limit.js"></script>
    <script src="shared-board-input.js"></script>
    <script src="shared-minesweeper-utils.js"></script>
    <script src="shared-sw-register.js"></script>
    <script src="info.js"></script>
    <script src="info-settings-mock.js"></script>
  </body>
</html>
